[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cluster"
version = "0.0.1"
description = "Multi-Notebook Distributed GPU Mesh: Pool Colab/Kaggle GPUs into a unified multi-GPU inference cluster."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "berlin-566" }
]
keywords = ["llm", "distributed", "multi-gpu", "vram-pooling", "google-colab", "kaggle", "llama-cpp", "tunnel", "ai"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "httpx>=0.24.0",
    "click>=8.0.0",
    "textual>=0.40.0",
    "rich>=12.0.0",
]

[project.optional-dependencies]
rich = ["rich>=12.0.0"]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[project.scripts]
cluster = "cluster.cli:main"
host-it = "cluster.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cluster*"]

[tool.setuptools.package-data]
cluster = ["web/*"]
